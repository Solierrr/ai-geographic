openapi: 3.1.0
info:
  title: Solaria — ai-geographic
  description: 'Copiloto de campo do profissional de energia solar: planeja a rota até o cliente, avalia clima e luz do dia
    de uma região em uma data e estima o potencial solar do local. Autentique com o JWT do api-auth.'
  contact:
    name: Solaria
    url: https://github.com/Solierrr
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 0.1.1 # x-release-please-version
servers:
- url: https://ai-geographic.onrender.com
  description: QA
- url: http://localhost:8000
  description: Local
paths:
  /chat:
    post:
      tags:
      - Conversa
      summary: Envia uma mensagem ao copiloto de campo
      description: 'Executa um turno da conversa com o JWT do profissional. Recusa do guardrail, falha de ferramenta e queda
        de provedor não são erro HTTP: voltam 200 com `outcome` e `reason`.'
      operationId: sendChatMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: JWT ausente, inválido ou expirado
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo da requisição inválido
          content: *id001
        '500':
          description: Erro interno inesperado
          content: *id001
      security:
      - bearerAuth: []
      x-error-codes:
      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - INTERNAL_ERROR
  /health:
    get:
      tags:
      - Saúde
      summary: Indica se o processo está vivo
      description: Só o processo, sem consultar dependências; traz a versão do release.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Erro interno inesperado
          content: *id001
      security: []
  /ready:
    get:
      tags:
      - Saúde
      summary: Indica se o serviço está pronto para atender
      description: 'Confere o Mongo (checkpointer e memória) e responde 503 com {"status": "DOWN"} quando ele não responde.
        Os provedores de LLM ficam de fora porque há fallback entre eles.'
      operationId: getReady
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '500':
          description: Erro interno inesperado
          content: *id001
      security: []
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          examples:
          - b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          examples:
          - Preciso de um instalador em SP
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
          description: Resposta do copiloto ao profissional.
        outcome:
          $ref: '#/components/schemas/Outcome'
          description: 'Resultado do turno: respondido, recusado pelo guardrail, degradado ou com ferramenta em falha.'
          examples:
          - ANSWERED
        reason:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
          description: Código do motivo, presente quando outcome não é ANSWERED.
          examples:
          - MAPS_UNAVAILABLE
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
      type: object
      required:
      - response
      - outcome
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - UP
        version:
          type: string
          title: Version
          examples:
          - 0.1.1
      type: object
      required:
      - status
      - version
      title: HealthResponse
    Outcome:
      type: string
      enum:
      - ANSWERED
      - REFUSED
      - DEGRADED
      - TOOL_FAILED
      title: Outcome
    ReadyResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - UP
      type: object
      required:
      - status
      title: ReadyResponse
    Reason:
      type: string
      enum:
      - OUT_OF_SCOPE
      - MANIPULATION_ATTEMPT
      - INTERNAL_DATA_REQUEST
      - FALSE_INFORMATION
      - GUARDRAIL_REFUSED
      - GUARDRAIL_UNAVAILABLE
      - LLM_FALLBACK
      - MAPS_UNAVAILABLE
      - SOLAR_DATA_UNAVAILABLE
      - PRODUCT_ADVISOR_UNAVAILABLE
      - TOOL_ERROR
      title: Reason
    ProblemFieldError:
      properties:
        field:
          examples:
          - message
          title: Field
          type: string
        errorCode:
          examples:
          - VALIDATION_FAILED
          title: Errorcode
          type: string
        detail:
          examples:
          - String should have at least 1 character
          title: Detail
          type: string
      required:
      - field
      - errorCode
      - detail
      title: ProblemFieldError
      type: object
    ProblemDetail:
      description: Corpo de todo erro HTTP do serviço.
      properties:
        type:
          examples:
          - about:blank
          title: Type
          type: string
        title:
          examples:
          - UNAUTHENTICATED
          title: Title
          type: string
        status:
          examples:
          - 401
          title: Status
          type: integer
        errorCode:
          examples:
          - UNAUTHENTICATED
          title: Errorcode
          type: string
        detail:
          examples:
          - Authorization header deve ser 'Bearer <token>'
          title: Detail
          type: string
        instance:
          examples:
          - /chat
          title: Instance
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        traceId:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          examples:
          - 4bf92f3577b34da6a3ce929d0e0e4736
          title: Traceid
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemFieldError'
            type: array
          - type: 'null'
          default: null
          title: Errors
      required:
      - type
      - title
      - status
      - errorCode
      - detail
      - instance
      - timestamp
      title: ProblemDetail
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Conversa
  description: Turnos de conversa com o copiloto.
- name: Saúde
  description: Vivo e pronto do serviço.
security:
- bearerAuth: []
