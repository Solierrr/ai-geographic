openapi: 3.1.0
info:
  title: ai-geographic API
  description: Assistente para endereços, fusos, potencial solar e deslocamentos.
  version: 0.1.0
paths:
  /chat:
    post:
      tags:
      - chat
      summary: Conversar
      description: Recebe uma mensagem do usuário e devolve a resposta do assistente.
      operationId: conversar_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Bearer token ausente ou inválido.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /health:
    get:
      summary: Health
      description: Responde 'ok' se o servidor subiu, listando configuração ausente.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          examples:
          - b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          examples:
          - Como vou do Centro ao Ibirapuera de carro agora?
        current_location:
          anyOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
          description: Coordenadas enviadas pelo app após permissão do usuário.
        user_timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: User Timezone
          description: Fuso IANA do usuário, usado para interpretar hoje/amanhã; padrão
            configurado pelo servidor.
          examples:
          - America/Sao_Paulo
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
        route_data:
          anyOf:
          - $ref: '#/components/schemas/RouteData'
          - type: 'null'
      type: object
      required:
      - response
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    Coordinate:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
      type: object
      required:
      - latitude
      - longitude
      title: Coordinate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RouteData:
      properties:
        route_id:
          type: string
          title: Route Id
        duration_seconds:
          type: integer
          minimum: 0.0
          title: Duration Seconds
        distance_meters:
          type: integer
          minimum: 0.0
          title: Distance Meters
        encoded_polyline:
          anyOf:
          - type: string
          - type: 'null'
          title: Encoded Polyline
        provider:
          type: string
          const: google_maps
          title: Provider
      type: object
      required:
      - route_id
      - duration_seconds
      - distance_meters
      - provider
      title: RouteData
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
