openapi: 3.0.3
info:
  title: '[NOME_DO_PROJETO]'
  description: Contrato HTTP deste serviço. Use um access token emitido pelo api-auth nas operações com bearerAuth.
    URLs e credenciais são configuradas no cliente HTTP; este arquivo não contém valores privados.
  version: 0.1.0
servers:
- url: http://localhost:{port}
  description: Execução local; ajuste a porta ou substitua o servidor no cliente HTTP.
  variables:
    port:
      default: '8000'
paths:
  /chat:
    post:
      tags:
      - Chat
      summary: Enviar mensagem ao chatbot
      description: Valida e persiste a mensagem antes de enfileirar seu processamento.
      operationId: conversar_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAcceptedResponse'
        '400':
          description: Validation Error (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
      security:
      - bearerAuth: []
  /chat/{event_id}:
    get:
      tags:
      - chat
      summary: Consultar processamento do chatbot
      description: Retorna o estado atual e as métricas temporárias de um evento.
      operationId: consultar_resultado_chat__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResultResponse'
        '404':
          description: Evento não encontrado ou resultado expirado.
        '400':
          description: Validation Error (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
      security: []
  /health:
    get:
      summary: Health
      description: Informa se as configurações obrigatórias foram fornecidas.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
      security: []
components:
  schemas:
    ChatAcceptedResponse:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
        status:
          type: string
          title: Status
          default: queued
          enum:
          - queued
      type: object
      required:
      - event_id
      title: ChatAcceptedResponse
      description: Confirma o recebimento da mensagem pela fila.
    ChatRequest:
      properties:
        conversation_id:
          type: string
          minLength: 1
          title: Conversation Id
          example: conversa-exemplo-42
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
          example: Mensagem de exemplo do usuário
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: Mensagem enviada ao chatbot.
    ChatResultResponse:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
          title: Status
        conversation_id:
          type: string
          nullable: true
          title: Conversation Id
        response:
          type: string
          nullable: true
          title: Response
        error:
          type: string
          nullable: true
          title: Error
        error_type:
          type: string
          nullable: true
          title: Error Type
        queued_at:
          type: string
          format: date-time
          nullable: true
          title: Queued At
        started_at:
          type: string
          format: date-time
          nullable: true
          title: Started At
        completed_at:
          type: string
          format: date-time
          nullable: true
          title: Completed At
        queue_wait_ms:
          type: integer
          minimum: 0.0
          nullable: true
          title: Queue Wait Ms
        processing_time_ms:
          type: integer
          minimum: 0.0
          nullable: true
          title: Processing Time Ms
        total_time_ms:
          type: integer
          minimum: 0.0
          nullable: true
          title: Total Time Ms
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
      type: object
      required:
      - event_id
      - status
      title: ChatResultResponse
      description: Estado temporário do processamento assíncrono.
    ProblemDetail:
      description: "Corpo de todo erro (application/problem+json, RFC 9457). O cliente decide pelo errorCode; detail é texto para humanos."
      type: object
      required:
      - title
      - status
      - detail
      - errorCode
      - timestamp
      properties:
        title:
          type: string
          description: "Reason phrase do status (ex.: Bad Request)."
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Caminho da requisição.
        errorCode:
          type: string
          description: "Código estável em UPPER_SNAKE (ex.: VALIDATION_ERROR, UNAUTHENTICATED, ACCESS_DENIED, RESOURCE_NOT_FOUND, INTERNAL_ERROR)."
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: Presente só quando há span ativo.
      additionalProperties: true
      title: ProblemDetail
    ValidationProblemDetail:
      description: "Erro de validação de entrada (400 VALIDATION_ERROR). field e message são os nativos do Pydantic (ex.: items.0.qty, Field required)."
      allOf:
      - $ref: '#/components/schemas/ProblemDetail'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - message
              properties:
                field:
                  type: string
                  nullable: true
                message:
                  type: string
      title: ValidationProblemDetail
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de usuário emitido pelo api-auth.
